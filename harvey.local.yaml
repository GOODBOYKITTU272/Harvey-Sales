  objection_responses:
    "will this disrupt our daily operations": "Not at all. Your staff only records routine, approved hands-on tasks they are already performing using a smartphone, with zero change to your customer workflow."
    "what about customer and employee privacy": "We guarantee 100% automated bystander face de-identification, PII redaction, and audio masking. No customer faces or sensitive details ever leave your facility unredacted."
    "what equipment do we need": "No expensive cameras or special rigs are needed. Any standard smartphone (iPhone 12+, Pixel 6+, Galaxy S21+) works with our tap-and-record Minutes tool."
    "how and when do we get paid": "Payouts are task-based for accepted datasets and distributed weekly directly to your company account via Zoho Books."
    "not interested": "Understood. Many facility owners don't realize that everyday commercial tasks like auto servicing, food prep, or warehouse picking are worth significant compensation to robotics AI labs right now. Would you be open to a 5-minute task rate overview?"
