  description: "Monetize hands-on commercial work tasks by capturing verified first-person (egocentric) smartphone video for robotics AI training, with 100% automated face/PII redaction and weekly payouts."
  pricing: "15–18 AED per hour for accepted task recordings in UAE; $15–$25 USD/hr in US. Weekly payouts via Zoho Books."
